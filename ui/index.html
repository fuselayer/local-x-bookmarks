      No external font, stylesheet, or script is loaded here, and that is a
      product requirement rather than an omission. X serves its Chirp typeface

      X-owned host, which PRD §7.1 forbids outright. We therefore render in the
      closest system stack instead. See src/styles/x.css for what that costs us.
    -->
